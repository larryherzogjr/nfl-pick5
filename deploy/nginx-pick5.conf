server {
    listen 80;
    listen [::]:80;
    server_name pick5.ospdy.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pick5.ospdy.com;

    ssl_certificate /etc/letsencrypt/live/pick5.ospdy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pick5.ospdy.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6m;

    location = /healthz {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /avatars/ {
        proxy_pass http://127.0.0.1:5000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    root /srv/nfl-pick5/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
